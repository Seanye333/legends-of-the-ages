<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>千古名将 · Legends of the Ages</title>
    <!-- 图标由 assets/logo.svg 经 scripts/make-logo.mjs 光栅化生成 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#12100c" />
    <!-- 标题底图是首屏唯一的美术(87KB WebP),却要等 CSS 解析完才开始下载 ——
         preload 让它和 JS 并行走,慢网络上第一眼不再是纯色底。 -->
    <link rel="preload" as="image" type="image/webp" href="/art/title-hero.webp" />
  </head>
  <body>
    <!-- 湿墨滤镜的定义。放在 index.html 而不是某个组件里:
         SVG filter 是按 id 全局引用的,而引用它的是纯 CSS(.ink-wipe),
         挂在组件上会出现「组件没挂载时滤镜 id 不存在」的时序问题。
         零字节资产 —— 噪声是算出来的,不是图片。 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="inkBleed" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="3" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
