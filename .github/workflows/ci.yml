name: CI

# 之前这个仓库完全没有 CI:lint / test / e2e / 平衡闸门一个都不自动跑,
# 全靠手动。sim-balance 明明会 exit 1,却没有任何东西去执行它 —— 闸门等于不存在。
on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧任务在新推送时直接取消,不浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint（含引擎纯度围栏）
        run: npm run lint

      - name: 类型检查 + 构建
        run: npm run build

      # 含 server/ 的单测(ELO 数学、赛季换算、TOFU 判定、协议闸门)。
      # server/ 不在 tsc 项目内,单测是这部分逻辑唯一的自动化防线 ——
      # drive-test 覆盖得更全,但它要手动起 wrangler,进不了 CI。
      - name: 单元测试
        run: npm test

      - name: 端到端(Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      # 三条有明确 exit-code 语义的闸门,此前**只能手动跑** ——
      # 也就是说它们和「没有闸门」没区别。build 已经在上面跑过了,直接接上。
      - name: 首屏体积预算
        run: npm run perf-budget

      - name: 引擎确定性对拍(同一 seed 必须重演出同一局)
        run: npm run replay-diff

      # 产物入库会**掩盖源头漂移**:姊妹仓库改了数据,已提交的卡池不会变、
      # CI 也不会红,而下一个人重跑生成脚本时卡池就在他手里换了一副。
      # 这一条断言「重跑产物与已提交的逐字节一致」——
      # 它红了才说明源头真的漂了,那时候再做决定。
      - name: 生成层漂移自检
        run: npm run check-generated

      # 三个盘点脚本此前全靠人主动跑。它们不 exit 1,所以只做记录 ——
      # 真正的闸门在 vitest 里(dossier.test 的覆盖率下限、enPurity.test)。
      - name: 内容盘点(记录用,不卡门)
        run: npm run audit-all

      - name: 离线自检(PWA 断网可玩)
        run: npm run check-offline

      # 生产依赖必须干净。dev 依赖不卡门:wrangler → miniflare → sharp 这条链
      # 只影响本地 Worker 开发,不进浏览器产物,卡了它 CI 会因为上游发版随机红。
      - name: 依赖审计(仅生产依赖)
        run: npm audit --omit=dev --audit-level=high

      - name: 失败时保留 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  balance:
    # 平衡模拟慢,与主检查并行跑,不拖慢反馈。
    # 关底闸门从 60 局提到 240 局(见下面那一步的说明)之后,这个 job 的大头是它:
    # 本机 ~12 分钟,CI 的单线程更慢,所以余量给到 45 —— 闸门因超时而红
    # 和闸门因噪声而红是同一类毛病,都是「红了但不说明任何事」。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 两道闸门:每套预组总胜率 40-60%,且任一对位 30-70%。
      # 脚本自己 exit 1,这里不用额外判断。
      # 局数固定 100 —— 40 局的噪声有 ±8 个百分点,拿来当闸门只会制造误报。
      - name: 预组平衡闸门
        run: npm run sim-balance
        env:
          GAMES: 100

      - name: 预组结构体检
        run: npm run deck-stats

      # 关底战三道闸门:首关够友好 / 末关够难 / 整体递减。
      # 与预组闸门放同一个 job —— 两者都是「内容改了会悄悄失衡」的那类回归。
      #
      # **不要在这里写 GAMES**,用脚本自己的默认值(240)。
      # 这里曾经钉着 GAMES: 60,而 60 局撑不起这道闸门自己的判定:
      # 「章内前后半落差 ≥8」的差值标准误是 4.5pp —— 既会被两三个点的抖动判红,
      # 又在真实落差为 0 时也红不了(z 只有 1.8)。main 上因此挂着一次纯噪声的红。
      # 判定现在走显著性检验,240 局才有分辨力,理由见 scripts/campaignGate.ts。
      - name: 关底战难度闸门
        run: npm run sim-campaign

      # 备选主公技闸门:sim-balance 只测基准主公,测不到备选主公技。
      # 这道补那个洞 —— 每个备选主公在自家预组镜像里 40–60%。
      - name: 备选主公技闸门
        run: npm run sim-hero-mirror
        env:
          GAMES: 100

  content:
    # 内容生成必须幂等:cards.gen.ts 入 git,重跑一次不能有 diff。
    # 需要姊妹仓库,CI 上没有 —— 所以这里只验证「已入库的产物与源码自洽」。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 生成物不能被手改
        run: |
          if git diff --quiet -- src/content/generated; then
            echo "generated content clean"
          else
            echo "::error::src/content/generated 有未提交的改动"
            git diff --stat -- src/content/generated
            exit 1
          fi
